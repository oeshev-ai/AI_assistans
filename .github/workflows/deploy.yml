name: Deploy

# Публикация образа только после успешного CI на main.
# github.ref у workflow_run — ветка по умолчанию; проверяем и её, и head_branch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}

      # Авто-доставка на VPS (раскомментировать после чеклиста в README «Деплой»).
      # Секреты: SSH_HOST, SSH_USER=deploy, SSH_PRIVATE_KEY.
      # На сервере: APP_IMAGE=ghcr.io/oeshev-ai/ai_assistans:latest
      # и docker login ghcr.io (если пакет private).
      # Каталог: /home/deploy/AI_assistans (не /opt/vpd06).
      # При ARQ_ENABLED=1 заменить up на:
      #   docker compose --profile arq pull
      #   docker compose --profile arq up -d
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/deploy/AI_assistans
            docker compose pull
            docker compose up -d
