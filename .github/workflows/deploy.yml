name: Deploy

# Публикация образа только после успешного CI на main.
# github.ref у workflow_run — ветка по умолчанию; проверяем и её, и head_branch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}

      # Каталог на VPS: /home/deploy/AI_assistans. Секреты: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY.
      # pull всегда с профилем arq, чтобы образ воркера не оставался старым.
      # up с профилем — только если контейнер worker уже running или restarting:
      # остановленный или ни разу не созданный воркер деплой не поднимает.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/deploy/AI_assistans
            docker compose --profile arq pull
            update_worker=0
            for id in $(docker compose --profile arq ps -aq worker); do
              state="$(docker inspect -f '{{.State.Status}}' "$id")"
              case "$state" in
                running|restarting) update_worker=1 ;;
              esac
            done
            if [ "$update_worker" -eq 1 ]; then
              docker compose --profile arq up -d
            else
              docker compose up -d
            fi
