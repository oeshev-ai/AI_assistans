name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-prod.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy
        # App + entrypoints only; tests use lightweight doubles that fight redis-py 5 stubs.
        run: mypy app bot.py worker.py --ignore-missing-imports

      - name: Pytest
        run: pytest tests/ -v

      - name: Prod requirements install smoke
        run: |
          python -m venv /tmp/prod-venv
          /tmp/prod-venv/bin/python -m pip install --upgrade pip
          /tmp/prod-venv/bin/pip install -r requirements-prod.txt
          /tmp/prod-venv/bin/python -c "import aiogram, httpx, redis, arq, boto3, sentry_sdk"

      - name: Docker image build smoke
        run: docker build -t ai-assistans:ci .

      - name: Docker entrypoint smoke
        run: |
          docker run --rm \
            -e REDIS_HOST=redis \
            -e REDIS_PASSWORD='p@ss word' \
            ai-assistans:ci \
            python -c "import os; url=os.environ['REDIS_URL']; assert url=='redis://:p%40ss%20word@redis:6379/0', url"
          docker run --rm \
            -e REDIS_HOST=redis \
            ai-assistans:ci \
            python -c "import os; url=os.environ['REDIS_URL']; assert url=='redis://redis:6379/0', url"
