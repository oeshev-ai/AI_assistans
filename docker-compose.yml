# APP_IMAGE: GHCR tag published by Deploy workflow (docker compose pull).
# Local default tags the build as ai-assistans:local so build+up still work.
x-app: &app
  image: ${APP_IMAGE:-ai-assistans:local}
  build: .

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # volatile-ttl: every app key has EXPIRE. Under the cap Redis drops the
    # shortest remaining TTL first (rate limits, album/arq payloads, then
    # stale topics). Active chats refresh TTL, so they go last. noeviction
    # rejected every write once 256mb was full, including a new history line.
    # REDIS_MAXMEMORY is digits plus a unit (256mb, 1gb). Optional
    # REDIS_PASSWORD → requirepass (set matching REDIS_URL on bot/worker).
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        MEM="$${REDIS_MAXMEMORY:-256mb}"
        case "$$MEM" in
          ''|*[!0-9A-Za-z]*)
            echo "invalid REDIS_MAXMEMORY: $$MEM" >&2
            exit 1
            ;;
        esac
        ARGS="--appendonly yes --maxmemory $$MEM --maxmemory-policy volatile-ttl"
        if [ -n "$$REDIS_PASSWORD" ]; then
          ARGS="$$ARGS --requirepass $$REDIS_PASSWORD"
        fi
        exec redis-server $$ARGS
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping; else redis-cli ping; fi',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    <<: *app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Host is compose service; omit userinfo when REDIS_PASSWORD is empty
      # (redis://:@host breaks arq AUTH). Password set → redis://:pass@redis:6379/0
      # Пустой REDIS_PASSWORD при ENVIRONMENT=production завершает процесс бота.
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ENVIRONMENT: production
      # Keep in sync with .env; worker profile alone is not enough.
      ARQ_ENABLED: ${ARQ_ENABLED:-0}
      METRICS_PORT: ${METRICS_PORT:-8083}
      METRICS_BIND: "0.0.0.0"
      HEALTH_PORT: ${HEALTH_PORT:-8082}
      HEALTH_BIND: "0.0.0.0"
      # nginx terminates TLS and forwards X-Forwarded-Proto
      TRUST_PROXY: "1"
    ports:
      # Только localhost: наружу отдаёт nginx (assist.mrischool.ru → 8082)
      - "127.0.0.1:${METRICS_PORT:-8083}:${METRICS_PORT:-8083}"
      - "127.0.0.1:${HEALTH_PORT:-8082}:${HEALTH_PORT:-8082}"
    depends_on:
      redis:
        condition: service_healthy

  # Optional: docker compose --profile arq up -d  (also set ARQ_ENABLED=1 in .env)
  worker:
    <<: *app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ARQ_ENABLED: "1"
      ENVIRONMENT: production
    command: ["arq", "worker.WorkerSettings"]
    profiles: ["arq"]
    depends_on:
      redis:
        condition: service_healthy

  redis-backup:
    image: redis:7-alpine
    profiles: ["backup"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      BACKUP_DIR: /backups
      KEEP_DAYS: "7"
    volumes:
      - redis_data:/data:ro
      - ./backups/redis:/backups
      - ./scripts/backup_redis.sh:/backup_redis.sh:ro
    entrypoint: ["/bin/sh", "/backup_redis.sh"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
