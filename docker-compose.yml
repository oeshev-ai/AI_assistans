# APP_IMAGE: тег GHCR, который публикует workflow Deploy (docker compose pull).
# Локально по умолчанию образ собирается как ai-assistans:local, чтобы build и up
# работали без реестра.
x-app: &app
  image: ${APP_IMAGE:-ai-assistans:local}
  build: .

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Состояние бота: темы, персоны, FSM, бюджет, лимиты. Медиа очереди здесь нет.
    # volatile-ttl снимает ключ с самым коротким остатком TTL. noeviction при
    # заполнении отвергал любую запись, включая новую строку истории.
    # REDIS_MAXMEMORY — число и единица (512mb, 1gb). Пароль общий с redis-queue.
    # Потолок контейнера выше maxmemory: AOF и фрагментация, но не память VPS.
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-512mb}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        MEM="$${REDIS_MAXMEMORY:-512mb}"
        case "$$MEM" in
          ''|*[!0-9A-Za-z]*)
            echo "invalid REDIS_MAXMEMORY: $$MEM" >&2
            exit 1
            ;;
        esac
        ARGS="--appendonly yes --maxmemory $$MEM --maxmemory-policy volatile-ttl"
        if [ -n "$$REDIS_PASSWORD" ]; then
          ARGS="$$ARGS --requirepass $$REDIS_PASSWORD"
        fi
        exec redis-server $$ARGS
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping; else redis-cli ping; fi',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Payload правки (~27 МБ base64 на альбом 20 МБ), байты STT (до 20 МБ)
  # и результаты arq. Отдельный инстанс: переполнение здесь не трогает FSM и бюджет.
  # noeviction, не volatile-ttl: keep_result = 60 с короче TTL payload, и
  # volatile-ttl снимал бы свежий arq:result раньше backlog. Полная память
  # отвергает запись на enqueue, до платного вызова.
  # 10 задач: 10×27 МБ + 10×20 МБ ≈ 470 МБ, плюс результаты 60 с. 256 МБ это не держат.
  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 1280m
    memswap_limit: 1280m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_MAXMEMORY: ${REDIS_QUEUE_MAXMEMORY:-768mb}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        MEM="$${REDIS_MAXMEMORY:-768mb}"
        case "$$MEM" in
          ''|*[!0-9A-Za-z]*)
            echo "invalid REDIS_MAXMEMORY: $$MEM" >&2
            exit 1
            ;;
        esac
        ARGS="--appendonly yes --maxmemory $$MEM --maxmemory-policy noeviction"
        if [ -n "$$REDIS_PASSWORD" ]; then
          ARGS="$$ARGS --requirepass $$REDIS_PASSWORD"
        fi
        exec redis-server $$ARGS
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping; else redis-cli ping; fi',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    <<: *app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Хост — сервис compose. REDIS_URL собирает entrypoint: пароль
      # percent-encoding, пустой пароль без userinfo (redis://:@host ломает arq).
      # Пустой REDIS_PASSWORD при ENVIRONMENT=production завершает процесс бота.
      REDIS_HOST: redis
      REDIS_QUEUE_HOST: redis-queue
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ENVIRONMENT: production
      # Держать в соответствии с .env: одного профиля worker недостаточно.
      ARQ_ENABLED: ${ARQ_ENABLED:-0}
      METRICS_PORT: ${METRICS_PORT:-8083}
      METRICS_BIND: "0.0.0.0"
      HEALTH_PORT: ${HEALTH_PORT:-8082}
      HEALTH_BIND: "0.0.0.0"
      # nginx завершает TLS и передаёт X-Forwarded-Proto
      TRUST_PROXY: "1"
    # Два upload по 512 МБ: объект на диске, в RAM только куски STT. cgroup режет контейнер, не VPS.
    mem_limit: 1536m
    memswap_limit: 1536m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; port=os.environ.get('HEALTH_PORT','8082'); urllib.request.urlopen('http://127.0.0.1:%s/live' % port, timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    ports:
      # Только localhost: наружу отдаёт nginx (assist.mrischool.ru → 8082)
      - "127.0.0.1:${METRICS_PORT:-8083}:${METRICS_PORT:-8083}"
      - "127.0.0.1:${HEALTH_PORT:-8082}:${HEALTH_PORT:-8082}"
    depends_on:
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  # Необязательно: docker compose --profile arq up -d (и ARQ_ENABLED=1 в .env)
  worker:
    <<: *app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_QUEUE_HOST: redis-queue
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ARQ_ENABLED: "1"
      ENVIRONMENT: production
    # Тот же образ: картинки и STT тоже держат байты файла в памяти.
    mem_limit: 1024m
    memswap_limit: 1024m
    command: ["arq", "worker.WorkerSettings"]
    profiles: ["arq"]
    depends_on:
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  redis-backup:
    image: redis:7-alpine
    profiles: ["backup"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      BACKUP_DIR: /backups
      KEEP_DAYS: "7"
    volumes:
      - redis_data:/data:ro
      - ./backups/redis:/backups
      - ./scripts/backup_redis.sh:/backup_redis.sh:ro
    entrypoint: ["/bin/sh", "/backup_redis.sh"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  redis_queue_data:
