[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Явный select: в ruff 0.17 дефолт слишком широкий для текущего кода.
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
  "ASYNC",
  "S",
  "RUF",
]
ignore = [
  "E402",  # load_dotenv() до локальных импортов
  "E501",
  "RUF001",
  "RUF002",
  "RUF003",
  "RUF006",
  "S101",
  "S104",
  "S105",
  "S106",
  "S107",
  "S110",
  "S311",
  "ASYNC109",
  "ASYNC230",
  "ASYNC240",
  "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Bot package still re-exports via ``import *`` from constants until fully explicit.
"app/bot/constants.py" = ["F401"]
"app/bot/models.py" = ["F403", "F405"]
"app/bot/runtime.py" = ["F403", "F405"]
"app/bot/main.py" = ["F403", "F405"]
"app/bot/screens/*.py" = ["F403", "F405"]
"app/bot/handlers/*.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "app.bot.constants",
  "app.bot.models",
  "app.bot.runtime",
  "app.bot.main",
  "app.bot.screens.*",
  "app.bot.handlers.*",
]
# Star-import re-exports from constants; runtime OK via __all__.
disable_error_code = ["name-defined"]
